# Chunks-LMS local Supabase project
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "chunks-lms"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Local JWT secret for development only
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
enable_signup = true

# Clerk third-party auth is configured per environment.
# See docs/ops/ci-cd.md and ADR 0002.
