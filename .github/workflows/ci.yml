name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build · OpenSpec
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: OpenSpec validate
        run: npx --yes @fission-ai/openspec@latest validate --all

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Unit tests
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build
        env:
          # Build must succeed without real secrets (auth shell degrades gracefully)
          VITE_AUTH_BYPASS: 'true'
